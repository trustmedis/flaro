name = "realtime-hub"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "realtime-hub"
database_id = "a3ee7ed0-685f-4bb2-926f-a85e8d2f2a58"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "APP_DO"
class_name = "ApplicationDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ApplicationDO"]

[assets]
directory = "../admin/dist"

[vars]
CLERK_ISSUER = "https://wanted-eagle-57.clerk.accounts.dev"

[observability]
enabled = true
